[tools]
node = "26" # Active LTS

[tasks.install]
description = "Install npm packages and Playwright Chromium"
sources = ["package.json", "package-lock.json"]
outputs = ["node_modules/.package-lock.json"]
run = [
  "npm ci",
  # On CI, also install the system libraries Chromium needs.
  "npx playwright install ${CI:+--with-deps} chromium",
]

[tasks.build]
description = "Build the standalone page into dist/"
depends = ["install"]
sources = ["index.html", "src/**", "scripts/build.js", "package-lock.json"]
outputs = ["dist/index.html", "dist/app.js", "dist/app.css", "dist/asn.css"]
run = "npm run build"

[tasks.test]
description = "Unit tests, then print dist/index.html to PDF and compare it with the Avery L4731 reference sheet"
depends = ["build"]
run = "npm test"

[tasks."test:live"]
description = "Run the tests against the live site"
env = { ASN_TARGET = "https://tobiasmaier.info/asn-qr-code-label-generator/" }
run = "mise run test"

[tasks.pdf]
description = "Print the default label sheet to asn-labels.pdf"
depends = ["build"]
run = "npm run pdf"

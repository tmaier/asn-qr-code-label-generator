name: Print geometry tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      target:
        description: "Page to test (empty = index.html of this commit, or a URL such as the live site)"
        required: false
        default: ""
      tolerance_mm:
        description: "Allowed deviation per label edge in mm"
        required: false
        default: "0.3"

jobs:
  print-geometry:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Print to PDF and compare with Avery L4731REV-25
        run: npm test
        env:
          ASN_TARGET: ${{ inputs.target }}
          ASN_TOLERANCE_MM: ${{ inputs.tolerance_mm || '0.3' }}

      - name: Upload printed PDFs, overlays and reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: print-geometry-results
          path: test-results/
          retention-days: 30

name: Generate PDF Labels

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  generate-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install tools from mise.toml
        uses: jdx/mise-action@v5

      - name: Cache npm packages and Playwright browsers
        uses: actions/cache@v6
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-npm-playwright-${{ hashFiles('package-lock.json') }}

      - name: Generate PDF
        run: mise run pdf

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v7
        with:
          name: asn-labels-pdf
          path: asn-labels.pdf
          retention-days: 30
